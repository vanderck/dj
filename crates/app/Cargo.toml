[package]
name = "dj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "dj: live performance DJ software"

[[bin]]
name = "dj"
path = "src/main.rs"

[features]
default = ["stems-onnx"]
# Run ONNX stem-separation models: downloads ONNX Runtime at build time and links it statically.
stems-onnx = ["stems-core/onnx"]
# Same, but loads an existing libonnxruntime at runtime (set ORT_DYLIB_PATH).
stems-onnx-dynamic = ["stems-core/onnx-dynamic"]

[dependencies]
stems-core.workspace = true
dj-engine.workspace = true
dj-library.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rtrb.workspace = true
hound.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
cpal.workspace = true
midir.workspace = true
rosc.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
dirs.workspace = true
dj-vst3.workspace = true
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
