[package]
name = "stems-plugin"
version.workspace = true
edition.workspace = true
description = "Real-time stem separation plugin (CLAP / VST3)"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["vst3"]
# VST3 export. NOTE: nih-plug's VST3 bindings are GPLv3; see README before shipping closed source.
vst3 = ["nih_plug/vst3"]
# Debug builds panic if the audio thread allocates.
assert-no-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug.workspace = true
nih_plug_egui.workspace = true
triple_buffer.workspace = true
stems-core = { path = "../stems-core" }
