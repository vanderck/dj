[package]
name = "stems-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stem separation for dj: HT-Demucs (ONNX), STFT mask models and a heuristic placeholder"
publish = false

[features]
# ONNX Runtime backend, downloading and statically linking ONNX Runtime at build time.
onnx = ["dep:ort", "ort/std", "ort/ndarray", "ort/download-binaries", "ort/copy-dylibs", "ort/tls-native"]
# ONNX Runtime backend, loading an existing libonnxruntime at runtime (ORT_DYLIB_PATH).
onnx-dynamic = ["dep:ort", "ort/std", "ort/ndarray", "ort/load-dynamic"]

[dependencies]
realfft.workspace = true
ort = { workspace = true, optional = true }
