[workspace]
resolver = "2"
members = ["crates/engine", "crates/library", "crates/vst3host", "crates/vst3-testplugin", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
collective-engine = { path = "crates/engine" }
collective-library = { path = "crates/library" }
collective-vst3 = { path = "crates/vst3host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", features = ["all"] }
cpal = "0.18.2"
midir = "0.11.1"
rosc = "0.11.4"
hound = "3.5.1"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", features = ["glow"] }
dirs = "7.0.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
