name: macOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # stems-core with ONNX Runtime: Demucs and model tests against the small test models.
      - run: cargo test -p stems-core --features onnx
      - run: cargo clippy -p stems-core --all-targets --features onnx -- -D warnings
      - run: cargo fmt -p stems-core -- --check

  # HT-Demucs's network as a Core ML model (32-bit), bundled with the app: converted
  # from Demucs's weights (tools/htdemucs_coreml), compiled, and checked against Mixxx's ONNX
  # model through dj's own code. Converted again only when the converter changes.
  coreml-model:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: model
        with:
          path: target/coreml/htdemucs.mlmodelc
          key: htdemucs-coreml-${{ hashFiles('tools/htdemucs_coreml/convert.py') }}
      - name: Convert HT-Demucs to Core ML
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet "torch==2.7.0" "coremltools==9.0" "numpy<2.3" einops julius
          python -m pip install --quiet --no-deps demucs==4.1.0 openunmix
          mkdir -p target/coreml
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/htdemucs.th" https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th
          python tools/htdemucs_coreml/convert.py "$RUNNER_TEMP/htdemucs.th" "$RUNNER_TEMP/htdemucs.mlpackage"
          xcrun coremlcompiler compile "$RUNNER_TEMP/htdemucs.mlpackage" target/coreml/
          ls -la target/coreml/htdemucs.mlmodelc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: coreml
      - uses: actions/cache@v4
        with:
          path: target/mixxx-htdemucs.onnx
          key: mixxx-htdemucs-onnx-v1
      - name: Check it against Mixxx's HT-Demucs
        run: |
          [ -s target/mixxx-htdemucs.onnx ] || curl -sSfL --retry 3 -o target/mixxx-htdemucs.onnx https://github.com/mixxxdj/demucs/releases/latest/download/htdemucs.onnx
          python -m pip install --quiet numpy
          python tools/htdemucs_coreml/mix.py > "$RUNNER_TEMP/mix.f32"
          # (Absolute paths: the test runs in the crate's folder.)
          DEMUCS_MODEL="$PWD/target/mixxx-htdemucs.onnx" DEMUCS_NETWORK="$PWD/target/coreml/htdemucs.mlmodelc" \
            DEMUCS_MIX="$RUNNER_TEMP/mix.f32" MIN_DB=50 \
            cargo test -p stems-core --features onnx --test demucs -- --ignored the_network --nocapture
      # TEMPORARY diagnosis: a 32-bit model next to the 16-bit one.
      - uses: actions/upload-artifact@v4
        with:
          name: htdemucs-coreml
          path: target/coreml/htdemucs.mlmodelc

  package:
    runs-on: macos-latest
    needs: coreml-model
    permissions:
      contents: write # to attach the .dmg to a release on tags
    env:
      # Optional. Without these the app is ad-hoc signed and not notarized.
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      - name: Import signing certificate
        if: env.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - uses: actions/download-artifact@v4
        with:
          name: htdemucs-coreml
          path: target/coreml/htdemucs.mlmodelc

      - name: Build and package
        env:
          DJ_COREML_MODEL: target/coreml/htdemucs.mlmodelc
        run: |
          ARGS=()
          [ -n "$MACOS_SIGN_IDENTITY" ] && [ -n "$APPLE_ID" ] && ARGS+=(--notarize)
          cargo xtask package-macos "${ARGS[@]}"

      - name: Check the bundle
        run: |
          APP=target/package/dj.app
          plutil -lint "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/AppIcon.icns" && /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/htdemucs.mlmodelc/coremldata.bin"
          codesign --verify --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/dj" | tee /dev/stderr | grep -qx "arm64"
          "$APP/Contents/MacOS/dj" --help > /dev/null
          hdiutil verify target/package/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dj-macos
          path: target/package/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/package/*.dmg --generate-notes || gh release upload "$GITHUB_REF_NAME" target/package/*.dmg --clobber
