name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  package:
    runs-on: windows-latest
    permissions:
      contents: write # to attach the .zip to a release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Build
        run: cargo build --release -p dj
      - name: Check and package
        shell: pwsh
        run: |
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq dj | Select-Object -ExpandProperty version
          $dir = "target/package/dj"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/dj.exe $dir
          Copy-Item README.md $dir
          # Starts and exits (command-line use; the GUI needs a desktop session).
          & "$dir/dj.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dj.exe --help failed" }
          Compress-Archive -Path "$dir/*" -DestinationPath "target/package/dj-$ver-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dj-windows
          path: target/package/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/package/*.zip --clobber || gh release create "$GITHUB_REF_NAME" target/package/*.zip --generate-notes
